<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bruder Oviedo — Host</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#f8f6f2;--surface:#fff;--surface2:#f1efe9;--surface3:#e8e5de;--border:#ddd9d0;--border2:#ccc8be;--text:#1a1816;--text2:#6b6560;--text3:#9c9890;--amber:#c47d0a;--amber-dim:#e8a830;--amber-bg:#fef3dc;--teal:#0a8a62;--teal-dim:#2db88a;--teal-bg:#e0f5ee;--red:#c42020;--red-dim:#e06060;--red-bg:#fdeaea;--blue:#1a6abf;--blue-dim:#60a8f5;--blue-bg:#e6f0fb;--pink:#b01f6a;--pink-dim:#e060a8;--pink-bg:#fde6f2;--radius:16px;--radius-sm:10px;--font:'DM Sans',sans-serif;--mono:'DM Mono',monospace}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:var(--font);color:var(--text)}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px 10px;border-bottom:0.5px solid var(--border);flex-shrink:0;gap:10px}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand-dot{width:28px;height:28px;border-radius:8px;background:var(--pink);display:flex;align-items:center;justify-content:center}
.brand-dot svg{width:14px;height:14px;fill:#fff}
.brand-name{font-size:13px;font-weight:600;letter-spacing:0.04em}
.brand-sub{font-size:11px;color:var(--text3)}
.topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.lang-toggle{display:flex;border:0.5px solid var(--border2);border-radius:20px;overflow:hidden}
.lang-btn{padding:5px 12px;font-size:12px;font-weight:500;font-family:var(--font);background:transparent;border:none;cursor:pointer;color:var(--text2);transition:all .2s}
.lang-btn.active{background:var(--pink);color:#fff}
.clock{font-family:var(--mono);font-size:12px;color:var(--text3)}
.section-tabs{display:flex;gap:6px;padding:10px 20px;border-bottom:0.5px solid var(--border);flex-shrink:0;overflow-x:auto}
.section-tabs::-webkit-scrollbar{display:none}
.stab{flex-shrink:0;padding:7px 14px;border-radius:var(--radius-sm);border:0.5px solid var(--border);font-size:13px;font-weight:500;color:var(--text2);background:transparent;cursor:pointer;font-family:var(--font);transition:all .2s;display:flex;align-items:center;gap:6px}
.stab-dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.7}
.stab.active-preshift{background:var(--pink-bg);border-color:var(--pink-dim);color:var(--pink)}
.stab.active-station{background:var(--teal-bg);border-color:var(--teal-dim);color:var(--teal)}
.stab.active-service{background:var(--pink-bg);border-color:var(--pink-dim);color:var(--pink)}
.stab.active-waitlist{background:var(--blue-bg);border-color:var(--blue-dim);color:var(--blue)}
.stab.active-closing{background:var(--amber-bg);border-color:var(--amber-dim);color:var(--amber)}
.stab.active-summary{background:var(--surface2);border-color:var(--border2);color:var(--text)}
.progress-wrap{padding:10px 20px 0;flex-shrink:0}
.progress-meta{display:flex;justify-content:space-between;margin-bottom:5px}
.progress-label{font-size:12px;color:var(--text3)}
.progress-count{font-family:var(--mono);font-size:12px;color:var(--text2)}
.pbar{height:4px;background:var(--surface3);border-radius:2px;overflow:hidden}
.pbar-fill{height:100%;border-radius:2px;transition:width .4s}
.fill-preshift,.fill-service{background:var(--pink)}
.fill-station{background:var(--teal)}
.fill-closing{background:var(--amber)}
.fill-waitlist{background:var(--blue)}
.main{flex:1;overflow-y:auto;padding:12px 20px 100px;-webkit-overflow-scrolling:touch}
.block-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;animation:fadeIn .18s ease both}
.block-head{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;user-select:none}
.block-time{font-family:var(--mono);font-size:11px;font-weight:500;padding:3px 10px;border-radius:6px;white-space:nowrap;flex-shrink:0}
.bt-preshift,.bt-service{background:var(--pink-bg);color:var(--pink);border:0.5px solid var(--pink-dim)}
.bt-station{background:var(--teal-bg);color:var(--teal);border:0.5px solid var(--teal-dim)}
.bt-waitlist{background:var(--blue-bg);color:var(--blue);border:0.5px solid var(--blue-dim)}
.bt-closing{background:var(--amber-bg);color:var(--amber);border:0.5px solid var(--amber-dim)}
.block-title{flex:1;font-size:15px;font-weight:500;line-height:1.3}
.block-badge{font-family:var(--mono);font-size:11px;color:var(--text3);flex-shrink:0}
.chevron-icon{color:var(--text3);font-size:18px;transition:transform .25s;flex-shrink:0}
.block-body{border-top:0.5px solid var(--border)}
.check-item{display:flex;align-items:flex-start;gap:12px;padding:13px 16px;border-bottom:0.5px solid var(--border);cursor:pointer;-webkit-user-select:none;transition:background .15s}
.check-item:last-child{border-bottom:none}
.check-item:active{background:var(--surface2)}
.check-item.done{opacity:.4}
.check-item.done .ci-text{text-decoration:line-through}
.ci-box{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--border2);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.ci-box.checked{background:var(--pink);border-color:var(--pink)}
.ci-box.checked-teal{background:var(--teal);border-color:var(--teal)}
.ci-box.checked-amber{background:var(--amber);border-color:var(--amber)}
.ci-check{display:none;width:11px;height:11px}
.ci-box.checked .ci-check,.ci-box.checked-teal .ci-check,.ci-box.checked-amber .ci-check{display:block}
.ci-check path{stroke:#fff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.step-num{font-size:10px;font-weight:600;font-family:var(--mono);padding:2px 7px;border-radius:5px;white-space:nowrap;flex-shrink:0;margin-top:2px}
.sn-pink{background:var(--pink-bg);color:var(--pink);border:0.5px solid var(--pink-dim)}
.sn-amber{background:var(--amber-bg);color:var(--amber);border:0.5px solid var(--amber-dim)}
.sn-teal{background:var(--teal-bg);color:var(--teal);border:0.5px solid var(--teal-dim)}
.ci-text{font-size:14px;line-height:1.5;color:var(--text);flex:1}
.policy-banner{border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;margin-bottom:10px;display:flex;gap:8px;align-items:flex-start;line-height:1.5;font-weight:500}
.policy-amber{background:var(--amber-bg);color:var(--amber);border:0.5px solid var(--amber-dim)}
.policy-pink{background:var(--pink-bg);color:var(--pink);border:0.5px solid var(--pink-dim)}
.policy-teal{background:var(--teal-bg);color:var(--teal);border:0.5px solid var(--teal-dim)}
.policy-blue{background:var(--blue-bg);color:var(--blue);border:0.5px solid var(--blue-dim)}
.lastcall-banner{background:var(--red-bg);border:0.5px solid var(--red-dim);border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;color:var(--red);margin-bottom:10px;line-height:1.6;font-weight:500}
.waitlist-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.waitlist-table th{background:var(--pink);color:#fff;padding:8px 6px;text-align:center;font-weight:500;border:0.5px solid var(--pink-dim)}
.waitlist-table td{padding:10px 6px;border:0.5px solid var(--border);text-align:center;background:var(--surface)}
.waitlist-table tr:nth-child(even) td{background:var(--pink-bg)}
.waitlist-table .num{color:var(--text3);font-family:var(--mono);font-size:11px}
.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.res-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);padding:16px}
.res-val{font-size:30px;font-weight:600;font-family:var(--mono)}
.res-lbl{font-size:12px;color:var(--text3);margin-top:4px}
.res-total{grid-column:1/-1}
.pend-title{font-size:11px;font-weight:500;color:var(--text3);margin-bottom:10px;letter-spacing:0.05em;text-transform:uppercase}
.pend-item{display:flex;gap:8px;align-items:flex-start;padding:9px 0;border-bottom:0.5px solid var(--border);font-size:13px;line-height:1.4}
.pend-item:last-child{border-bottom:none}
.pend-time{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:4px;background:var(--surface2);color:var(--text3);white-space:nowrap;flex-shrink:0}
.bottom-bar{position:absolute;bottom:0;left:0;right:0;padding:10px 20px 24px;background:linear-gradient(transparent,var(--bg) 40%);display:flex;gap:8px}
.btn-action{padding:11px 16px;border-radius:var(--radius-sm);border:0.5px solid var(--border2);font-size:13px;font-weight:500;color:var(--text);background:var(--surface);cursor:pointer;font-family:var(--font);display:flex;align-items:center;gap:6px;transition:all .2s;flex:1;justify-content:center;min-height:44px}
.btn-action:active{transform:scale(0.97)}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="app">

<!-- ══ LOGIN SCREEN ══ -->
<div id="login-screen" style="position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px">
  <div style="width:100%;max-width:340px">
    <div style="text-align:center;margin-bottom:32px">
      <div style="width:64px;height:64px;border-radius:18px;background:#1a6abf;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:30px;box-shadow:0 4px 20px rgba(0,0,0,.15)">🎯</div>
      <div style="font-size:22px;font-weight:600;color:var(--text)">Host · Anfitrión</div>
      <div style="font-size:13px;color:var(--text3);margin-top:4px">Bruder Oviedo &middot; 1280 Oviedo Mall</div>
    </div>
    <div style="background:var(--surface);border:0.5px solid var(--border);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 2px 16px rgba(0,0,0,.06)">
      <div>
        <label style="font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:7px">¿Cómo te llamas?</label>
        <input id="login-name" type="text" placeholder="Tu nombre" autocomplete="name"
          style="width:100%;padding:14px;border:0.5px solid var(--border2);border-radius:10px;font-family:var(--font);font-size:16px;color:var(--text);background:var(--surface2);outline:none;-webkit-appearance:none"
          oninput="loginCheck()" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <div id="login-error" style="display:none;font-size:12px;color:var(--red);padding:8px 12px;background:var(--red-bg);border-radius:8px;text-align:center"></div>
      <button id="login-btn" onclick="doLogin()" disabled
        style="width:100%;padding:15px;border-radius:10px;border:none;font-family:var(--font);font-size:15px;font-weight:600;cursor:pointer;transition:all .25s;background:var(--border2);color:var(--text3);opacity:.6">
        Comenzar turno &rarr;
      </button>
    </div>
  </div>
</div>


  <div class="topbar">
    <div class="brand">
      <div class="brand-dot"><svg viewBox="0 0 14 14"><path d="M7 1C4.24 1 2 3.24 2 6c0 1.85 1 3.47 2.49 4.34L4 13h6l-.49-2.66C11 9.47 12 7.85 12 6c0-2.76-2.24-5-5-5z"/></svg></div>
      <div><div class="brand-name">Bruder Oviedo</div><div class="brand-sub" id="top-sub">Host Checklist · Thu–Sun</div></div>
    </div>
    <div class="topbar-right">
      <div class="lang-toggle">
        <button class="lang-btn active" onclick="setLang('en',this)">EN</button>
        <button class="lang-btn" onclick="setLang('es',this)">ES</button>
      </div>
      <div class="clock" id="clock">--:--</div>
    </div>
  </div>
  <div class="section-tabs" id="section-tabs"></div>
  <div class="progress-wrap" id="prog-wrap">
    <div class="progress-meta"><span class="progress-label" id="prog-label">Pre-Shift</span><span class="progress-count" id="prog-count">0/0</span></div>
    <div class="pbar"><div class="pbar-fill fill-preshift" id="prog-fill" style="width:0%"></div></div>
  </div>
  <div class="main" id="main-content"></div>
  <div class="bottom-bar">
    <button class="btn-action" onclick="resetAll()" id="btn-reset">↺ New day</button>
    <button class="btn-action" onclick="window.print()" id="btn-print">⎙ Print</button>
    <button class="btn-action" style="background:var(--pink-bg);border-color:var(--pink-dim);color:var(--pink);flex:none;padding:11px 14px" onclick="saveShift()">💾</button>
  </div>
</div>

<div id="save-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:9999;padding:16px;overflow-y:auto">
  <div style="background:var(--bg);border-radius:var(--radius);max-width:560px;margin:0 auto;padding:18px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div style="font-size:14px;font-weight:600" id="modal-title">Shift Summary</div>
      <button onclick="document.getElementById('save-modal').style.display='none'" style="font-size:24px;background:none;border:none;cursor:pointer;color:var(--text2)">×</button>
    </div>
    <div style="background:var(--surface2);border-radius:var(--radius-sm);padding:12px;font-family:var(--mono);font-size:11px;line-height:1.9;white-space:pre-wrap;border:0.5px solid var(--border);max-height:360px;overflow-y:auto" id="summary-text"></div>
    <div style="margin-top:10px;font-size:11px;color:var(--pink);background:var(--pink-bg);border-radius:var(--radius-sm);padding:10px 12px;border:0.5px solid var(--pink-dim)" id="modal-hint"></div>
    <div style="margin-top:10px;display:flex;gap:8px">
      <button onclick="copySummary()" id="copy-btn" style="flex:1;padding:12px;border-radius:var(--radius-sm);background:var(--pink-bg);border:0.5px solid var(--pink-dim);color:var(--pink);font-size:13px;font-weight:500;cursor:pointer;font-family:var(--font);min-height:44px">📋 Copy</button>
      <button onclick="document.getElementById('save-modal').style.display='none'" id="close-btn" style="flex:1;padding:12px;border-radius:var(--radius-sm);background:var(--surface);border:0.5px solid var(--border2);color:var(--text2);font-size:13px;cursor:pointer;font-family:var(--font);min-height:44px">Close</button>
    </div>
  </div>
</div>

<script>
let lang='en', curSection='preshift', checks={};

const T={
  en:{sub:'Host Checklist · Thu–Sun',preshift:'Pre-Shift',station:'Station',service:'Service',waitlist:'Waitlist',closing:'Closing',summary:'Summary',reset:'↺ New day',print:'⎙ Print',pending:'Pending',allDone:'✓ All tasks completed',tasks:' tasks',
    golden:'😊  GOLDEN RULE: ALWAYS greet every guest with a big smile and say "Welcome to Bruder!" — you are the first impression of the restaurant.',
    door:'📍  HOST IS ALWAYS AT THE DOOR. Weekend: 2 hosts — while one walks a party to their table, the other stays at the station. The station is NEVER left unattended.',
    comm:'📢  KEY COMMUNICATION: Notify server when table is seated. In busy service: ask server if ready before seating next table.',
    wait:'⏱  Give an estimated wait of 10 minutes — always be honest. Send a text when the table is ready.',
    lc:'⏰  Watch for LAST CALLS — Food · Pizza · Bar — see exact times on manager\'s board',
  },
  es:{sub:'Planilla Host · Jue–Dom',preshift:'Pre-Turno',station:'Estación',service:'Servicio',waitlist:'Lista Espera',closing:'Cierre',summary:'Resumen',reset:'↺ Nuevo día',print:'⎙ Imprimir',pending:'Pendientes',allDone:'✓ Todas completadas',tasks:' tareas',
    golden:'😊  REGLA DE ORO: Recibir SIEMPRE a cada cliente con una gran sonrisa y decir "¡Bienvenidos a Bruder!" — eres la primera impresión del restaurante.',
    door:'📍  EL HOST SIEMPRE ESTÁ EN LA PUERTA. Fin de semana somos 2 hosts: mientras uno lleva una mesa, el otro permanece en la estación. La estación NUNCA queda sin personal.',
    comm:'📢  COMUNICACIÓN CLAVE: Avisar al mesero cuando su mesa esté lista. En servicio intenso: preguntar al mesero si está listo antes de sentar una mesa.',
    wait:'⏱  Dar espera estimada de 10 minutos — siempre ser honestos. Enviar mensaje cuando la mesa esté lista.',
    lc:'⏰  Estar atento a los ÚLTIMOS LLAMADOS — Comida · Pizza · Barra — ver horas en planilla del manager',
  }
};

const DATA={
  preshift:[{type:'preshift',title:{en:'Pre-Shift — Arrive 10 min early',es:'Pre-Turno — Llegar 10 min antes'},numbered:true,items:[
    {n:'1',en:'Wash hands upon entering — BEFORE any task',es:'Lavarse las manos al ingresar — ANTES de cualquier tarea'},
    {n:'2',en:'Put on full uniform',es:'Ponerse el uniforme completo'},
    {n:'3',en:'Clock in on Toast system',es:'Hacer clock-in en el sistema Toast'},
    {n:'4',en:"Attend manager briefing — know each server's assigned zone",es:'Asistir al briefing del manager — conocer zonas asignadas a cada mesero'},
    {n:'5',en:"Review today's reservations: WhatsApp group (or system when available)",es:'Revisar reservas del día: grupo de WhatsApp (o sistema cuando esté disponible)'},
    {n:'6',en:'Plan placement of each reservation on the table map',es:'Planear la ubicación de cada reserva en el mapa de mesas'},
    {n:'7',en:'Have enough wrapped cutlery ready at the station',es:'Tener suficientes cubiertos envueltos listos en la estación'},
    {n:'8',en:'Have clean menus in good condition available',es:'Tener cartas limpias y en buen estado disponibles'},
    {n:'9',en:'Have table spray filled and ready at station',es:'Tener splash lleno y listo en la estación'},
    {n:'10',en:'Have phone available for waitlist messaging',es:'Tener celular disponible para enviar mensajes a lista de espera'},
  ]}],
  station:[{type:'station',title:{en:'Station Opening',es:'Apertura de Estación'},items:[
    {en:'Wrapped cutlery — sufficient quantity for the shift',es:'Cubiertos envueltos — cantidad suficiente para el turno'},
    {en:'Clean menus — no stains or tears',es:'Cartas limpias — sin manchas ni roturas'},
    {en:'Station clean and free of paper',es:'Estación limpia y sin papeles'},
    {en:'Table spray filled at station',es:'Splash lleno en la estación'},
    {en:"Reservations reviewed and placed on table map",es:'Reservas revisadas y ubicadas en el mapa de mesas'},
    {en:"Table map updated with each server's zone",es:'Mapa de mesas actualizado con zonas de cada mesero'},
    {en:'Phone charged for waitlist',es:'Celular cargado para lista de espera'},
    {en:'Soup and dessert spoons available at station',es:'Cucharas de sopa y postre disponibles en la estación'},
  ]}],
  service:[{type:'service',title:{en:'During Service — Always at the door',es:'Durante el Servicio — Siempre en la puerta'},items:[
    {n:'①',style:'pink',en:'😊 Greet every guest: "Welcome to Bruder!" — always with a big smile',es:'😊 Recibir a cada cliente: "¡Bienvenidos a Bruder!" — siempre con una gran sonrisa'},
    {n:'②',style:'pink',en:'Check if they have a reservation or are walk-ins',es:'Verificar si tienen reserva o si vienen sin reserva'},
    {n:'③',style:'pink',en:'Assign table by server zone — one table at a time per server when possible',es:'Asignar mesa según zona del mesero — en lo posible una mesa a la vez por mesero'},
    {n:'④',style:'pink',en:'Check with the server if they are ready before seating',es:'Revisar con el mesero si está listo para recibir la mesa antes de sentarlos'},
    {n:'⑤',style:'pink',en:'Walk guests to their table with menus and cutlery',es:'Llevar a los clientes a la mesa con cartas y cubiertos'},
    {n:'⑥',style:'pink',en:'"Your server will be right with you"',es:'"Mi compañero ya viene a atenderlos"'},
    {n:'⑦',style:'pink',en:'📢 Notify the server: "Table X ready to be served"',es:'📢 Comunicar al mesero: "Mesa X lista para atender"'},
    {n:'⑧',style:'pink',en:'Maintain wrapped cutlery stocked at station at all times',es:'Mantener cubiertos envueltos disponibles en la estación en todo momento'},
    {n:'⑨',style:'pink',en:'Coordinate with runner when a table is free to clean it quickly',es:'Coordinar con el runner cuando una mesa esté libre para limpiarla rápido'},
  ]}],
  waitlist:[{type:'waitlist',title:{en:'Waitlist Management',es:'Manejo de Lista de Espera'},waitlist:true,items:[]}],
  closing:[{type:'closing',title:{en:'Shift Closing',es:'Cierre de Turno'},items:[
    {en:'Leave all cutlery wrapped and ready for next shift',es:'Dejar todos los cubiertos envueltos listos para el siguiente turno'},
    {en:'Return clean and organized menus',es:'Entregar cartas limpias y organizadas'},
    {en:'Fill table spray for next shift',es:'Llenar splash para el siguiente turno'},
    {en:'Leave station organized and free of paper',es:'Dejar estación organizada y sin papeles'},
    {en:"Log next day's reservations in system / group",es:'Registrar reservas del siguiente día en el sistema / grupo'},
    {en:'Hand updated table map to manager',es:'Entregar mapa de mesas actualizado al manager'},
    {en:'Clock out on the system',es:'Hacer clock-out en el sistema'},
  ]}],
};

const SECTIONS=['preshift','station','service','waitlist','closing','summary'];

function getBlocks(s){return DATA[s]||[];}
function t(k){return T[lang][k]||T.en[k]||k;}

function buildTabs(){
  document.getElementById('section-tabs').innerHTML=SECTIONS.map(s=>{
    const active=s===curSection?`active-${s}`:'';
    return`<button class="stab ${active}" onclick="switchSection('${s}',this)"><span class="stab-dot"></span>${t(s)}</button>`;
  }).join('');
}

function renderWaitlist(){
  const headers=lang==='en'?['#','Name','Phone','# Guests','Arrived','Called','Status']:
    ['#','Nombre','Teléfono','# Personas','Llegó','Llamado','Estado'];
  let html=`<div class="policy-banner policy-blue">${t('wait')}</div>`;
  html+=`<div class="block-card"><div style="padding:12px 16px;overflow-x:auto">
    <table class="waitlist-table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>`;
  for(let i=1;i<=10;i++){
    html+=`<tr><td class="num">${i}</td><td></td><td></td><td></td><td></td><td></td><td></td></tr>`;
  }
  html+=`</tbody></table></div></div>`;
  return html;
}

function render(){
  buildTabs();
  document.getElementById('top-sub').textContent=t('sub');
  document.getElementById('btn-reset').textContent=t('reset');
  document.getElementById('btn-print').textContent=t('print');
  if(curSection==='summary'){renderSummary();document.getElementById('prog-wrap').style.display='none';return;}
  if(curSection==='waitlist'){document.getElementById('main-content').innerHTML=renderWaitlist();document.getElementById('prog-wrap').style.display='none';return;}
  document.getElementById('prog-wrap').style.display='block';
  const main=document.getElementById('main-content');
  const blocks=getBlocks(curSection);
  let html='';
  if(curSection==='preshift') html+=`<div class="policy-banner policy-amber">${t('golden')}</div>`;
  if(curSection==='service'){html+=`<div class="policy-banner policy-pink">${t('door')}</div><div class="policy-banner policy-teal">${t('comm')}</div>`;}
  if(curSection==='closing') html+=`<div class="lastcall-banner">${t('lc')}</div>`;
  blocks.forEach((block,bi)=>{
    const title=block.title[lang]||block.title.en;
    const total=block.items.length;
    const done=block.items.filter((_,ii)=>checks[curSection+'_'+bi+'_'+ii]).length;
    html+=`<div class="block-card"><div class="block-head" onclick="toggleBlock('${curSection}_${bi}')">
      <span class="block-time bt-${block.type}">${title}</span>
      <span class="block-badge">${done}/${total}</span>
      <span class="chevron-icon" id="chev-${curSection}_${bi}">⌄</span>
    </div><div class="block-body" id="body-${curSection}_${bi}">`;
    block.items.forEach((item,ii)=>{
      const key=curSection+'_'+bi+'_'+ii;
      const isDone=checks[key]||false;
      const txt=item[lang]||item.en;
      const chkClass=curSection==='station'?'checked-teal':curSection==='closing'?'checked-amber':'checked';
      if(block.numbered){
        html+=`<div class="check-item ${isDone?'done':''}" onclick="toggleCheck('${key}')">
          <div class="ci-box ${isDone?'checked':''}" id="chk-${key}"><svg class="ci-check" viewBox="0 0 11 11"><path d="M1.5 5.5l3 3 5-5"/></svg></div>
          <span class="step-num sn-pink">${item.n}</span><span class="ci-text">${txt}</span></div>`;
      } else if(item.n){
        html+=`<div class="check-item ${isDone?'done':''}" onclick="toggleCheck('${key}')">
          <div class="ci-box ${isDone?chkClass:''}" id="chk-${key}"><svg class="ci-check" viewBox="0 0 11 11"><path d="M1.5 5.5l3 3 5-5"/></svg></div>
          <span class="step-num sn-pink">${item.n}</span><span class="ci-text">${txt}</span></div>`;
      } else {
        html+=`<div class="check-item ${isDone?'done':''}" onclick="toggleCheck('${key}')">
          <div class="ci-box ${isDone?chkClass:''}" id="chk-${key}"><svg class="ci-check" viewBox="0 0 11 11"><path d="M1.5 5.5l3 3 5-5"/></svg></div>
          <span class="ci-text">${txt}</span></div>`;
      }
    });
    html+=`</div></div>`;
  });
  main.innerHTML=html;
  updateProgress();
}

function toggleBlock(id){
  const body=document.getElementById('body-'+id);const chev=document.getElementById('chev-'+id);
  if(!body)return;const isOpen=body.style.display!=='none';
  body.style.display=isOpen?'none':'block';if(chev)chev.style.transform=isOpen?'rotate(-90deg)':'rotate(0deg)';
}

function toggleCheck(key){checks[key]=!checks[key];render();}

function countSection(s){
  let total=0,done=0;
  getBlocks(s).forEach((b,bi)=>b.items.forEach((_,ii)=>{total++;if(checks[s+'_'+bi+'_'+ii])done++;}));
  return{total,done};
}

function updateProgress(){
  const{total,done}=countSection(curSection);
  const pct=total>0?Math.round(done/total*100):0;
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('prog-fill').className='pbar-fill fill-'+curSection;
  document.getElementById('prog-count').textContent=done+'/'+total+t('tasks');
  document.getElementById('prog-label').textContent=t(curSection);
}

function renderSummary(){
  const main=document.getElementById('main-content');
  let html='<div class="res-grid">';let gt=0,gd=0;
  [{k:'preshift',c:'var(--pink)'},{k:'station',c:'var(--teal)'},{k:'service',c:'var(--pink)'},{k:'closing',c:'var(--amber)'}].forEach(s=>{
    const{total,done}=countSection(s.k);gt+=total;gd+=done;
    const pct=total>0?Math.round(done/total*100):0;
    html+=`<div class="res-card"><div class="res-val" style="color:${s.c}">${pct}%</div><div class="res-lbl">${t(s.k)} · ${done}/${total}</div></div>`;
  });
  const tp=gt>0?Math.round(gd/gt*100):0;
  html+=`<div class="res-card res-total"><div class="res-val">${tp}%</div><div class="res-lbl">${t('summary')} · ${gd}/${gt}</div></div></div>`;
  html+=`<div class="pend-title">${t('pending')}</div>`;
  let any=false;
  ['preshift','station','service','closing'].forEach(s=>{
    getBlocks(s).forEach((block,bi)=>block.items.forEach((item,ii)=>{
      if(!checks[s+'_'+bi+'_'+ii]){any=true;const txt=item[lang]||item.en;
        html+=`<div class="pend-item"><span class="pend-time">${t(s)}</span><span style="font-size:13px;color:var(--text2);flex:1">${txt}</span></div>`;}
    }));
  });
  if(!any)html+=`<div style="padding:14px 0;font-size:14px;color:var(--pink)">${t('allDone')}</div>`;
  html+=`<div style="margin-top:16px;padding:12px;background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);font-size:12px;color:var(--text3);line-height:2">
    Name: ________________________________  Date: ________________<br>Signature: _______________________________  Manager: ________________________
  </div>`;
  main.innerHTML=html;
}

function switchSection(name,btn){curSection=name;render();}

function setLang(l,btn){
  lang=l;document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render();
}

function resetAll(){
  const msg=lang==='en'?'Reset all tasks?':'¿Reiniciar todas las tareas?';
  if(!confirm(msg))return;checks={};render();
}

function saveShift(){
  const now=new Date();
  const ds=now.toLocaleDateString('en-US',{weekday:'short',year:'numeric',month:'short',day:'numeric'});
  const ts=now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
  const lines=['=======================================','BRUDER OVIEDO — HOST SHIFT SUMMARY','=======================================','Date: '+ds+'  Time: '+ts,'Host: _________________________','---------------------------------------'];
  let gt=0,gd=0;
  ['preshift','station','service','closing'].forEach(s=>{
    let sd=0,st=0;
    getBlocks(s).forEach((b,bi)=>b.items.forEach((_,ii)=>{st++;gt++;if(checks[s+'_'+bi+'_'+ii]){sd++;gd++;}}));
    const pct=st>0?Math.round(sd/st*100):0;
    lines.push((pct===100?'[OK]':pct>=70?'[~]':'[X]')+' '+(T[lang][s]||s).toUpperCase()+': '+sd+'/'+st+' ('+pct+'%)');
    getBlocks(s).forEach((b,bi)=>b.items.forEach((item,ii)=>{
      if(!checks[s+'_'+bi+'_'+ii]){const txt=String(item[lang]||item.en||'');lines.push('  x '+txt.substring(0,55));}
    }));
  });
  const pct=gt>0?Math.round(gd/gt*100):0;
  lines.push('---------------------------------------','TOTAL: '+gd+'/'+gt+' ('+pct+'%)');
  lines.push('GRADE: '+(pct===100?'EXCELLENT':pct>=85?'GOOD':pct>=70?'NEEDS IMPROVEMENT':'BELOW STANDARD'));
  lines.push('=======================================','Notes:','','Signature: _________________________');
  document.getElementById('summary-text').textContent=lines.join('\n');
  document.getElementById('modal-title').textContent=lang==='en'?'Shift Summary — Paste in Google Sheets':'Resumen — Pegar en Google Sheets';
  document.getElementById('modal-hint').textContent=lang==='en'?'1) Copy  2) Open Google Sheets  3) Click cell  4) Paste':'1) Copiar  2) Abrir Google Sheets  3) Clic celda  4) Pegar';
  document.getElementById('copy-btn').textContent=lang==='en'?'📋 Copy':'📋 Copiar';
  document.getElementById('close-btn').textContent=lang==='en'?'Close':'Cerrar';
  document.getElementById('save-modal').style.display='block';
}

function copySummary(){
  navigator.clipboard.writeText(document.getElementById('summary-text').textContent).then(()=>{
    const btn=document.getElementById('copy-btn');const orig=btn.textContent;
    btn.textContent=lang==='en'?'✓ Copied!':'✓ ¡Copiado!';btn.style.background='var(--pink)';btn.style.color='#fff';
    setTimeout(()=>{btn.textContent=orig;btn.style.background='var(--pink-bg)';btn.style.color='var(--pink)';},2500);
  });
}

function updateClock(){const now=new Date();document.getElementById('clock').textContent=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');}
setInterval(updateClock,1000);updateClock();render();
</script>




<script>
// ══ LOGIN + PERSONALIZACIÓN — BRUDER OVIEDO ══
(function(){
  var ROLE_COLOR = '#1a6abf';
  var ROLE_NAME  = 'host';
  var today = new Date().toDateString();

  var DAYS_ES = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  var MONTHS_ES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

  function getFechaStr(){
    var d = new Date();
    return DAYS_ES[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS_ES[d.getMonth()];
  }

  function getGreeting(){
    var h = new Date().getHours();
    if(h < 12) return '☀️ Buenos días';
    if(h < 18) return '🌤 Buenas tardes';
    return '🌙 Buenas noches';
  }

  function getSaved(){ 
    try{ return JSON.parse(localStorage.getItem('bruder_user_'+ROLE_NAME)||'null'); }
    catch(e){return null;} 
  }

  function getFirstName(name){
    return name.split(' ')[0];
  }

  function personalizeApp(name){
    var first = getFirstName(name);
    var fecha = getFechaStr();
    var greeting = getGreeting();

    // 1. Update brand-name in topbar with greeting
    var brandName = document.querySelector('.brand-name');
    if(brandName){
      brandName.innerHTML = 'Host · Anfitrión';
    }

    // 2. Update brand-sub with personalized greeting
    var brandSub = document.querySelector('.brand-sub');
    if(brandSub){
      brandSub.textContent = greeting + ', ' + first + ' · ' + fecha;
    }

    // 3. If there's a top-subtitle span (Server app)
    var topSub = document.getElementById('top-subtitle');
    if(topSub){
      topSub.textContent = greeting + ', ' + first + ' · ' + fecha;
    }

    // 4. Update page title
    document.title = 'Host · Anfitrión · ' + first;
  }

  function injectUserBadge(name){
    var right = document.querySelector('.topbar-right');
    if(!right) return;
    var old = document.getElementById('user-badge');
    if(old) old.remove();
    var initials = name.split(' ').map(function(w){return w[0]||'';}).join('').toUpperCase().slice(0,2);
    var badge = document.createElement('div');
    badge.id = 'user-badge';
    badge.style.cssText = 'display:flex;align-items:center;gap:7px;padding:5px 12px 5px 6px;border-radius:20px;background:var(--surface2);border:0.5px solid var(--border2);cursor:pointer;font-size:12px;color:var(--text2);flex-shrink:0';
    badge.innerHTML = '<div style="width:26px;height:26px;border-radius:50%;background:'+ROLE_COLOR+';color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0">'+initials+'</div><span style="font-weight:500;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+name.split(' ')[0]+'</span>';
    badge.onclick = function(){
      if(confirm('¿Cambiar de usuario?')){
        localStorage.removeItem('bruder_user_'+ROLE_NAME);
        location.reload();
      }
    };
    right.insertBefore(badge, right.firstChild);
  }

  // ── Check existing session ──
  var saved = getSaved();
  if(saved && saved.date === today && saved.name){
    var ls = document.getElementById('login-screen');
    if(ls) ls.style.display = 'none';
    injectUserBadge(saved.name);
    // Wait for DOM then personalize
    if(document.readyState === 'loading'){
      document.addEventListener('DOMContentLoaded', function(){ personalizeApp(saved.name); });
    } else {
      personalizeApp(saved.name);
    }
  }

  window.loginCheck = function(){
    var n = (document.getElementById('login-name').value||'').trim();
    var btn = document.getElementById('login-btn');
    var valid = n.length >= 2;
    btn.disabled = !valid;
    btn.style.background = valid ? ROLE_COLOR : '';
    btn.style.color = valid ? '#fff' : '';
    btn.style.opacity = valid ? '1' : '.6';
  };

  window.doLogin = function(){
    var n = (document.getElementById('login-name').value||'').trim();
    var errEl = document.getElementById('login-error');
    if(!n || n.length < 2){ showErr('Ingresa tu nombre'); return; }
    localStorage.setItem('bruder_user_'+ROLE_NAME, JSON.stringify({name:n, date:today}));
    var ls = document.getElementById('login-screen');
    ls.style.transition = 'opacity .3s ease';
    ls.style.opacity = '0';
    setTimeout(function(){ ls.style.display='none'; }, 320);
    injectUserBadge(n);
    personalizeApp(n);
  };

  function showErr(msg){
    var el = document.getElementById('login-error');
    el.textContent = msg; el.style.display = 'block';
    setTimeout(function(){ el.style.display='none'; }, 3000);
  }
})();
</script>
