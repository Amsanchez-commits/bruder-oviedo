<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Bruder Oviedo — Operador</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f8f6f2;--surface:#ffffff;--surface2:#f1efe9;--surface3:#e8e5de;
  --border:#ddd9d0;--border2:#ccc8be;
  --text:#1a1816;--text2:#6b6560;--text3:#9c9890;
  --amber:#c47d0a;--amber-dim:#e8a830;--amber-bg:#fef3dc;
  --teal:#0a8a62;--teal-dim:#2db88a;--teal-bg:#e0f5ee;
  --red:#c42020;--red-dim:#e06060;--red-bg:#fdeaea;
  --blue:#1a6abf;--blue-dim:#60a8f5;--blue-bg:#e6f0fb;
  --pink:#b01f6a;--pink-dim:#e060a8;--pink-bg:#fde6f2;
  --radius:16px;--radius-sm:10px;
  --font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:var(--font);color:var(--text)}

/* ── LAYOUT ── */
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* ── TOP BAR ── */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 10px;border-bottom:0.5px solid var(--border);flex-shrink:0;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand-dot{width:28px;height:28px;border-radius:8px;background:var(--amber);display:flex;align-items:center;justify-content:center}
.brand-dot svg{width:14px;height:14px;fill:var(--bg)}
.brand-name{font-size:13px;font-weight:600;letter-spacing:0.04em;color:var(--text)}
.brand-sub{font-size:11px;color:var(--text3);letter-spacing:0.02em}
.day-pills{display:flex;gap:6px;flex-shrink:0}
.day-pill{padding:6px 12px;border-radius:20px;border:0.5px solid var(--border2);font-size:12px;font-weight:500;color:var(--text2);background:transparent;cursor:pointer;font-family:var(--font);transition:all .2s;white-space:nowrap}
.day-pill.active{background:var(--amber);border-color:var(--amber);color:#000}
.clock{font-family:var(--mono);font-size:13px;color:var(--text2);flex-shrink:0}

/* ── SECTION TABS ── */
.section-tabs{display:flex;gap:6px;padding:12px 20px;border-bottom:0.5px solid var(--border);flex-shrink:0;overflow-x:auto}
.section-tabs::-webkit-scrollbar{display:none}
.stab{flex-shrink:0;padding:8px 16px;border-radius:var(--radius-sm);border:0.5px solid var(--border);font-size:13px;font-weight:500;color:var(--text2);background:transparent;cursor:pointer;font-family:var(--font);transition:all .2s;display:flex;align-items:center;gap:6px}
.stab.active-apertura{background:var(--teal-bg);border-color:var(--teal-dim);color:var(--teal)}
.stab.active-servicio{background:var(--blue-bg);border-color:var(--blue-dim);color:var(--blue)}
.stab.active-cierre{background:var(--amber-bg);border-color:var(--amber-dim);color:var(--amber)}
.stab.active-resumen{background:var(--surface2);border-color:var(--border2);color:var(--text)}
.stab-dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.7}

/* ── PROGRESS BAR ── */
.progress-wrap{padding:10px 20px 0;flex-shrink:0}
.progress-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.progress-label{font-size:12px;color:var(--text3)}
.progress-count{font-family:var(--mono);font-size:12px;color:var(--text2)}
.pbar{height:4px;background:var(--surface3);border-radius:2px;overflow:hidden}
.pbar-fill{height:100%;border-radius:2px;transition:width .4s cubic-bezier(.4,0,.2,1)}
.fill-apertura{background:var(--teal)}
.fill-servicio{background:var(--blue)}
.fill-cierre{background:var(--amber)}

/* ── MAIN SCROLL AREA ── */
.main{flex:1;overflow-y:auto;padding:12px 20px 100px;-webkit-overflow-scrolling:touch}
.main::-webkit-scrollbar{width:3px}
.main::-webkit-scrollbar-track{background:transparent}
.main::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* ── BLOCK CARDS ── */
.block-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
.block-head{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;user-select:none}
.block-time{font-family:var(--mono);font-size:11px;font-weight:500;padding:4px 10px;border-radius:6px;white-space:nowrap;flex-shrink:0}
.bt-apertura{background:var(--teal-bg);color:var(--teal);border:0.5px solid var(--teal-dim)}
.bt-servicio{background:var(--blue-bg);color:var(--blue);border:0.5px solid var(--blue-dim)}
.bt-cierre{background:var(--amber-bg);color:var(--amber);border:0.5px solid var(--amber-dim)}
.bt-critico{background:var(--red-bg);color:var(--red);border:0.5px solid var(--red-dim)}
.block-title{flex:1;font-size:15px;font-weight:500;color:var(--text);line-height:1.3}
.block-badge{font-family:var(--mono);font-size:11px;color:var(--text3);flex-shrink:0}
.chevron-icon{color:var(--text3);font-size:16px;transition:transform .25s;flex-shrink:0}
.chevron-icon.open{transform:rotate(180deg)}
.block-body{border-top:0.5px solid var(--border)}

/* ── CHECKLIST ITEMS ── */
.check-item{display:flex;align-items:flex-start;gap:14px;padding:14px 16px;border-bottom:0.5px solid var(--border);cursor:pointer;transition:background .15s;-webkit-user-select:none;user-select:none}
.check-item:last-child{border-bottom:none}
.check-item:active{background:var(--surface2)}
.check-item.done{opacity:.45}
.check-item.done .ci-text{text-decoration:line-through}
.ci-box{width:24px;height:24px;border-radius:6px;border:1.5px solid var(--border2);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.ci-box.checked{background:var(--teal);border-color:var(--teal)}
.ci-box.checked-amber{background:var(--amber);border-color:var(--amber)}
.ci-check{display:none;width:12px;height:12px}
.ci-box.checked .ci-check,.ci-box.checked-amber .ci-check{display:block}
.ci-check path{stroke:#000;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.zone-tag{font-size:10px;font-weight:500;padding:3px 8px;border-radius:5px;white-space:nowrap;flex-shrink:0;margin-top:2px;letter-spacing:0.02em}
.zt-bar{background:var(--blue-bg);color:var(--blue);border:0.5px solid var(--blue-dim)}
.zt-kitchen{background:var(--teal-bg);color:var(--teal);border:0.5px solid var(--teal-dim)}
.zt-salon{background:#1a0e2e;color:#c4a8f5;border:0.5px solid #4a3489}
.zt-all{background:var(--surface2);color:var(--text2);border:0.5px solid var(--border2)}
.zt-host{background:var(--pink-bg);color:var(--pink);border:0.5px solid var(--pink-dim)}
.zt-personal{background:var(--red-bg);color:var(--red);border:0.5px solid var(--red-dim)}
.ci-text{font-size:14px;line-height:1.5;color:var(--text);flex:1}

/* ── RESUMEN ── */
.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.res-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);padding:16px}
.res-val{font-size:32px;font-weight:600;font-family:var(--mono)}
.res-lbl{font-size:12px;color:var(--text3);margin-top:4px}
.res-total{grid-column:1/-1}
.pend-title{font-size:12px;font-weight:500;color:var(--text3);margin-bottom:10px;letter-spacing:0.04em;text-transform:uppercase}
.pend-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:0.5px solid var(--border);font-size:13px;line-height:1.4}
.pend-item:last-child{border-bottom:none}
.pend-time{font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:5px;background:var(--surface2);color:var(--text3);white-space:nowrap;flex-shrink:0;margin-top:1px}

/* ── BOTTOM ACTIONS ── */
.bottom-bar{position:absolute;bottom:0;left:0;right:0;padding:12px 20px 28px;background:linear-gradient(transparent,#f8f6f2 40%);display:flex;gap:10px;flex-wrap:wrap}
.btn-action{padding:12px 20px;border-radius:var(--radius-sm);border:0.5px solid var(--border2);font-size:13px;font-weight:500;color:var(--text);background:var(--surface);cursor:pointer;font-family:var(--font);display:flex;align-items:center;gap:7px;transition:all .2s;flex:1;justify-content:center;min-height:44px}
.btn-action:active{transform:scale(0.97);background:var(--surface2)}
.btn-action.btn-amber{background:var(--amber-bg);border-color:var(--amber-dim);color:var(--amber)}
.btn-action.btn-teal{background:var(--teal-bg);border-color:var(--teal-dim);color:var(--teal)}

/* ── LAST CALL BANNER ── */
.lc-banner{background:var(--blue-bg);border:0.5px solid var(--blue-dim);border-radius:var(--radius-sm);padding:10px 14px;font-size:12px;color:var(--blue);margin-bottom:12px;line-height:1.5}
.warn-banner{background:var(--amber-bg);border:0.5px solid var(--amber-dim);border-radius:var(--radius-sm);padding:10px 14px;font-size:12px;color:var(--amber);margin-bottom:12px;line-height:1.5;display:flex;gap:8px;align-items:flex-start}

/* ── DAY TABS ROW (servicio) ── */
.svc-days{display:flex;gap:6px;margin-bottom:12px}
.svc-day-btn{padding:6px 14px;border-radius:20px;border:0.5px solid var(--border);font-size:12px;color:var(--text2);background:transparent;cursor:pointer;font-family:var(--font);transition:all .2s}
.svc-day-btn.active{background:var(--blue-bg);border-color:var(--blue-dim);color:var(--blue)}

/* ANIMATIONS */
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.block-card{animation:fadeIn .2s ease both}
</style>
</head>

let checks={}, dayMode='semana', curSection='apertura', svcDay='semana';

function zLabel(z){return{bar:'Barra',kitchen:'Cocina',salon:'Salón',host:'Host',all:'General',personal:'Personal'}[z]||'General'}
function zClass(z){return{bar:'zt-bar',kitchen:'zt-kitchen',salon:'zt-salon',host:'zt-host',all:'zt-all',personal:'zt-personal'}[z]||'zt-all'}

function getBlocks(section, day){
  if(section==='apertura') return day==='finde'?AP_FINDE:AP_SEMANA;
  if(section==='servicio') return SERVICIO;
  return CIERRE;
}

function render(){
  const main=document.getElementById('main-content');
  if(curSection==='resumen'){renderResumen();return;}
  const blocks=getBlocks(curSection,dayMode);
  let html='';
  if(curSection==='apertura'){
    const isRed=dayMode==='semana';
    html+=`<div class="${isRed?'warn-banner':'lc-banner'}" style="display:flex;gap:8px;align-items:flex-start">
      <span>${isRed?'⚠':'ℹ'}</span>
      <span>${isRed?'Mar–Mié: sin host ni runner — operador coordina entradas, cartas y cubiertos. Jue: dotación completa.':'Vie–Dom: dotación completa — host y runner en posición. Apertura 12:00pm.'}</span>
    </div>`;
  }
  if(curSection==='servicio'){
    html+=`<div class="svc-days">
      <button class="svc-day-btn ${svcDay==='semana'?'active':''}" onclick="setSvcDay('semana',this)">Mar–Jue</button>
      <button class="svc-day-btn ${svcDay==='viesab'?'active':''}" onclick="setSvcDay('viesab',this)">Vie–Sáb</button>
      <button class="svc-day-btn ${svcDay==='dom'?'active':''}" onclick="setSvcDay('dom',this)">Dom</button>
    </div>
    <div class="lc-banner">${LC[svcDay]}</div>`;
  }
  blocks.forEach((block,bi)=>{
    const bId=curSection+'_'+bi;
    const total=block.items.length;
    const done=block.items.filter((_,ii)=>checks[curSection+'_'+bi+'_'+ii]).length;
    html+=`<div class="block-card">
      <div class="block-head" onclick="toggleBlock('${bId}')">
        <span class="block-time ${block.badge}">${block.time}</span>
        <span class="block-title">${block.title}</span>
        <span class="block-badge">${done}/${total}</span>
        <span class="chevron-icon open" id="chev-${bId}">&#8964;</span>
      </div>
      <div class="block-body" id="body-${bId}">`;
    block.items.forEach((item,ii)=>{
      const key=curSection+'_'+bi+'_'+ii;
      const done2=checks[key]||false;
      const isAmber=curSection==='cierre';
      html+=`<div class="check-item ${done2?'done':''}" onclick="toggleCheck('${key}',${bi},${ii})">
        <div class="ci-box ${done2?(isAmber?'checked-amber':'checked'):''}" id="chk-${key}">
          <svg class="ci-check" viewBox="0 0 12 12"><path d="M2 6l3 3 5-5"/></svg>
        </div>
        <span class="zone-tag ${zClass(item.z)}">${zLabel(item.z)}</span>
        <span class="ci-text">${item.t}</span>
      </div>`;
    });
    html+=`</div></div>`;
  });
  main.innerHTML=html;
  updateProgress();
}

function toggleBlock(id){
  const body=document.getElementById('body-'+id);
  const chev=document.getElementById('chev-'+id);
  if(!body)return;
  const isOpen=body.style.display!=='none';
  body.style.display=isOpen?'none':'block';
  if(chev)chev.style.transform=isOpen?'rotate(-90deg)':'rotate(0)';
}

function toggleCheck(key,bi,ii){
  checks[key]=!checks[key];
  render();
}

function countSection(s,day){
  const blocks=getBlocks(s,day);
  let total=0,done=0;
  blocks.forEach((block,bi)=>block.items.forEach((_,ii)=>{total++;if(checks[s+'_'+bi+'_'+ii])done++;}));
  return{total,done};
}

function updateProgress(){
  if(curSection==='resumen')return;
  const{total,done}=countSection(curSection,dayMode);
  const pct=total>0?Math.round(done/total*100):0;
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('prog-count').textContent=done+' / '+total+' tareas';
  document.getElementById('prog-label').textContent={apertura:'Apertura',servicio:'Servicio',cierre:'Cierre'}[curSection];
  const fillEl=document.getElementById('prog-fill');
  fillEl.className='pbar-fill fill-'+curSection;
}

function switchSection(name,btn){
  curSection=name;
  document.querySelectorAll('.stab').forEach(b=>{
    b.className='stab';
  });
  btn.className='stab active-'+name;
  document.getElementById('prog-wrap').style.display=name==='resumen'?'none':'block';
  render();
}

function setDay(mode,btn){
  dayMode=mode;
  document.querySelectorAll('.day-pill').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(curSection==='apertura')render();
  else updateProgress();
}

function setSvcDay(d){
  svcDay=d;
  render();
}

function renderResumen(){
  const main=document.getElementById('main-content');
  let html='<div class="res-grid">';
  const sections=[{k:'apertura',label:'Apertura',c:'var(--teal)'},{k:'servicio',label:'Servicio',c:'var(--blue)'},{k:'cierre',label:'Cierre',c:'var(--amber)'}];
  let gt=0,gd=0;
  sections.forEach(s=>{
    const{total,done}=countSection(s.k,dayMode);
    gt+=total;gd+=done;
    const pct=total>0?Math.round(done/total*100):0;
    html+=`<div class="res-card"><div class="res-val" style="color:${s.c}">${pct}%</div><div class="res-lbl">${s.label} · ${done}/${total}</div></div>`;
  });
  const totalPct=gt>0?Math.round(gd/gt*100):0;
  html+=`<div class="res-card res-total"><div class="res-val" style="color:var(--text)">${totalPct}%</div><div class="res-lbl">Total del día · ${gd}/${gt} tareas</div></div></div>`;
  html+='<div class="pend-title">Pendientes</div>';
  let any=false;
  ['apertura','servicio','cierre'].forEach(s=>{
    const blocks=getBlocks(s,dayMode);
    blocks.forEach((block,bi)=>{
      block.items.forEach((item,ii)=>{
        if(!checks[s+'_'+bi+'_'+ii]){
          any=true;
          html+=`<div class="pend-item">
            <span class="pend-time">${block.time}</span>
            <span class="zone-tag ${zClass(item.z)}">${zLabel(item.z)}</span>
            <span style="font-size:13px;color:var(--text2)">${item.t}</span>
          </div>`;
        }
      });
    });
  });
  if(!any)html+='<div style="padding:16px 0;font-size:14px;color:var(--teal)">✓ Todas las tareas completadas</div>';
  html+=`<div style="margin-top:20px;padding:12px 16px;background:var(--surface);border:0.5px solid var(--border);border-radius:var(--radius);font-size:12px;color:var(--text3);line-height:1.8">
    Fecha: ________________________________<br>
    Operador: ________________________________<br>
    Firma: ________________________________
  </div>`;
  main.innerHTML=html;
}

function resetAll(){
  if(!confirm('¿Reiniciar todas las tareas del día?'))return;
  checks={};
  render();
}

function updateClock(){
  const now=new Date();
  const h=String(now.getHours()).padStart(2,'0');
  const m=String(now.getMinutes()).padStart(2,'0');
  document.getElementById('clock').textContent=h+':'+m;
}
setInterval(updateClock,1000);
updateClock();
render();
</script>




<script>
// ══ LOGIN + PERSONALIZACIÓN — BRUDER OVIEDO ══
(function(){
  var ROLE_COLOR = '#1a1816';
  var ROLE_NAME  = 'manager';
  var today = new Date().toDateString();

  var DAYS_ES = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  var MONTHS_ES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

  function getFechaStr(){
    var d = new Date();
    return DAYS_ES[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS_ES[d.getMonth()];
  }

  function getGreeting(){
    var h = new Date().getHours();
    if(h < 12) return '☀️ Buenos días';
    if(h < 18) return '🌤 Buenas tardes';
    return '🌙 Buenas noches';
  }

  function getSaved(){ 
    try{ return JSON.parse(localStorage.getItem('bruder_user_'+ROLE_NAME)||'null'); }
    catch(e){return null;} 
  }

  function getFirstName(name){
    return name.split(' ')[0];
  }

  function personalizeApp(name){
    var first = getFirstName(name);
    var fecha = getFechaStr();
    var greeting = getGreeting();

    // 1. Update brand-name in topbar with greeting
    var brandName = document.querySelector('.brand-name');
    if(brandName){
      brandName.innerHTML = 'Manager · Operador';
    }

    // 2. Update brand-sub with personalized greeting
    var brandSub = document.querySelector('.brand-sub');
    if(brandSub){
      brandSub.textContent = greeting + ', ' + first + ' · ' + fecha;
    }

    // 3. If there's a top-subtitle span (Server app)
    var topSub = document.getElementById('top-subtitle');
    if(topSub){
      topSub.textContent = greeting + ', ' + first + ' · ' + fecha;
    }

    // 4. Update page title
    document.title = 'Manager · Operador · ' + first;
  }

  function injectUserBadge(name){
    var right = document.querySelector('.topbar-right');
    if(!right) return;
    var old = document.getElementById('user-badge');
    if(old) old.remove();
    var initials = name.split(' ').map(function(w){return w[0]||'';}).join('').toUpperCase().slice(0,2);
    var badge = document.createElement('div');
    badge.id = 'user-badge';
    badge.style.cssText = 'display:flex;align-items:center;gap:7px;padding:5px 12px 5px 6px;border-radius:20px;background:var(--surface2);border:0.5px solid var(--border2);cursor:pointer;font-size:12px;color:var(--text2);flex-shrink:0';
    badge.innerHTML = '<div style="width:26px;height:26px;border-radius:50%;background:'+ROLE_COLOR+';color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0">'+initials+'</div><span style="font-weight:500;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+name.split(' ')[0]+'</span>';
    badge.onclick = function(){
      if(confirm('¿Cambiar de usuario?')){
        localStorage.removeItem('bruder_user_'+ROLE_NAME);
        location.reload();
      }
    };
    right.insertBefore(badge, right.firstChild);
  }

  // ── Check existing session ──
  var saved = getSaved();
  if(saved && saved.date === today && saved.name){
    var ls = document.getElementById('login-screen');
    if(ls) ls.style.display = 'none';
    injectUserBadge(saved.name);
    // Wait for DOM then personalize
    if(document.readyState === 'loading'){
      document.addEventListener('DOMContentLoaded', function(){ personalizeApp(saved.name); });
    } else {
      personalizeApp(saved.name);
    }
  }

  window.loginCheck = function(){
    var n = (document.getElementById('login-name').value||'').trim();
    var btn = document.getElementById('login-btn');
    var valid = n.length >= 2;
    btn.disabled = !valid;
    btn.style.background = valid ? ROLE_COLOR : '';
    btn.style.color = valid ? '#fff' : '';
    btn.style.opacity = valid ? '1' : '.6';
  };

  window.doLogin = function(){
    var n = (document.getElementById('login-name').value||'').trim();
    var errEl = document.getElementById('login-error');
    if(!n || n.length < 2){ showErr('Ingresa tu nombre'); return; }
    localStorage.setItem('bruder_user_'+ROLE_NAME, JSON.stringify({name:n, date:today}));
    var ls = document.getElementById('login-screen');
    ls.style.transition = 'opacity .3s ease';
    ls.style.opacity = '0';
    setTimeout(function(){ ls.style.display='none'; }, 320);
    injectUserBadge(n);
    personalizeApp(n);
  };

  function showErr(msg){
    var el = document.getElementById('login-error');
    el.textContent = msg; el.style.display = 'block';
    setTimeout(function(){ el.style.display='none'; }, 3000);
  }
})();
</script>
